<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ANTI-CACHE HEADERS: Prevents storing login page in browser back-button cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>JW Security - Log In</title>

    <!-- INSTANT SESSION GUARD: Instantly jumps to dashboard if user is already logged in -->
    <script>
        if (sessionStorage.getItem('userRole')) {
            window.location.replace("dashboard.html");
        }
    </script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="login-body">

    <!-- CREDENTIAL LOGIN CARD -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="JW_Logo.jpg" alt="JW Logo" class="login-logo">
                <h1>Security Portal</h1>
                <p>Please enter your credentials to log in</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group text-left">
                    <label for="usernameInput">Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group text-left">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <div id="loginError" class="login-error-msg"></div>
                <button type="submit" class="btn btn-primary btn-block">Log In</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
