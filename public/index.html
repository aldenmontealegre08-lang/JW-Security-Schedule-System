<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ANTI-CACHE HEADERS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>JW Security - Secure Sign In</title>

    <!-- PWA / APP ICON CONFIGURATION -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="JW1.png">
    <link rel="icon" type="image/png" href="JW2.png">
    <meta name="theme-color" content="#0b0f19">

    <!-- INSTANT SESSION GUARD -->
    <script>
        if (sessionStorage.getItem('userRole')) {
            window.location.replace("dashboard.html");
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="login-body">

    <!-- ENTERPRISE LOGIN CARD -->
    <div class="login-container">
        <div class="login-card">
            <button type="button" class="btn btn-secondary btn-sm theme-toggle-btn" onclick="toggleDarkMode()" style="position: absolute; top: 1rem; right: 1rem;" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
            <div class="login-header">
                <img src="JW1.png" alt="JW Logo" class="login-logo">
                <h1>Security Portal</h1>
                <p>Authenticate to access the portal</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group text-left">
                    <label for="usernameInput">Username ID</label>
                    <input type="text" id="usernameInput" placeholder="Input user" required autocomplete="username">
                </div>
                <div class="form-group text-left">
                    <label for="passwordInput">Secure Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordInput" placeholder="Input password user123" required autocomplete="current-password">
                        <button type="button" id="togglePasswordBtn" class="password-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>
                <div id="loginError" class="login-error-msg"></div>
                <button type="submit" class="btn btn-primary btn-block">Access Portal</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
